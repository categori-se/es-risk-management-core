name: Reproducible bug
description: Report an application failure using synthetic data.
body:
  - type: textarea
    id: workflow
    attributes:
      label: Professional workflow and expected result
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction, observed result and release/commit
      description: Omit client documents, credentials and identifying records. Report vulnerabilities privately using SECURITY.md.
    validations:
      required: true
  - type: input
    id: installation
    attributes:
      label: Installation profile, operating system and Node version
